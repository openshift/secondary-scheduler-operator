# Allow all egress and metrics ingress for the secondary-scheduler-operator pod.
#
# Egress is needed for:
# - DNS resolution via openshift-dns
# - Kubernetes API server communication (address varies by cluster configuration)
# - Creating and managing operand resources across namespaces
#
# Ingress is needed for:
# - Prometheus metrics scraping on port 8443 (HTTPS, library-go default)
#
# Note: No health/readiness probes configured, so no kubelet access needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-egress-and-metrics-ingress
  namespace: openshift-secondary-scheduler-operator
  annotations:
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
spec:
  podSelector:
    matchLabels:
      name: secondary-scheduler-operator
  egress:
  - {}
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          openshift.io/cluster-monitoring: "true"
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-user-workload-monitoring
    ports:
    - protocol: TCP
      port: 8443
  policyTypes:
  - Ingress
  - Egress
